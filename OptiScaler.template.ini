[Upscalers]
Dx11Upscaler=@UPSCALER@
[Libraries]
OptiDllPath=@RUNTIME@
[FrameGen]
Enabled=true
FGInput=upscaler
FGOutput=xefg
[OptiFG]
DisableHUDFix=true
[XeFG]
ForceBorderless=false
[Dx11withDx12]
DontUseNTShared=true
[FSR]
Fsr4GpuSupport=2
Fsr4Model=1
Fsr4EnableWatermark=false
Fsr4DoNotLoadAmdxc64=true
FsrAgilitySDKUpgrade=false
VerticalFov=45
CameraNear=0.06
CameraFar=20000
[DLSS]
Enabled=false
[Menu]
OverlayMenu=false
FpsOverlayType=0
[Spoofing]
Dxgi=false
DxgiFactoryWrapping=true
[Log]
LogToFile=true
LogLevel=2
LogAsync=false
LogToConsole=false
LogFileName=@RUNTIME@\Heat-OptiScaler.log
